name: Verify application

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  verify:
    name: Verify legal content and application
    runs-on: ubuntu-latest
    env:
      LEGAL_RELEASE_MODE: development

    steps:
      - name: Check out application and pinned legal submodule
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HEARTLOG_LEGAL_READ_TOKEN }}
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify selected legal release
        run: npm run legal:verify

      - name: Type check
        run: npm run check

      - name: Run tests
        run: npm run test:run

      - name: Build application bundle
        run: npx vite build
